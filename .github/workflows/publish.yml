# Publishes @ninkch/dsh-artcraft to npm via Trusted Publishing (OIDC).
#
# 触发：GitHub Release 发布（published）时自动发布到 npm —— 无令牌、无 OTP。
#
# 维护者发版流程：
#   1. dev 测试通过并批准后，合并进 main，推送到 GitHub（推送由维护者自己执行）
#   2. GitHub → Releases → Draft a new release → 选/建 tag vX.Y.Z（必须与 package.json version 一致）→ Publish release
#   3. Actions 自动完成 npm 发布，全仓库无任何 npm 令牌
#
# npm 侧 Trusted Publisher 配置（一次性，已配置）：
#   Publisher           : GitHub Actions
#   Organization or user: NINKCH
#   Repository          : dsh-artcraft
#   Workflow filename   : publish.yml
#   Environment name    : (留空)
#   Allowed actions     : ☑ Allow npm publish
#
# 需要 npm >= 11.5.1 以支持 OIDC 可信发布（工作流内已升级）。

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC —— 代替一切 npm 令牌

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Guard — only release commits on main may publish
        run: |
          git fetch origin main --quiet
          for i in 1 2 3; do
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "release commit is on main (attempt $i)"
              exit 0
            fi
            echo "attempt $i: release commit not on main yet — retrying in 15s"
            sleep 15
            git fetch origin main --quiet
          done
          echo "::error::Release commit is not on main. Releases are only cut from main after dev-branch testing and maintainer approval (see RELEASING.md)."
          exit 1

      - name: Guard — package.json version must match the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::package.json version ($PKG) does not match release tag (v$TAG). Bump the version before releasing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
