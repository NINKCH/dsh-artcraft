# Publishes @ninkch/dsh-artcraft to npm via Trusted Publishing (OIDC).
#
# Setup (one-time, on npmjs.com → package → Settings → Trusted Publisher):
#   Publisher           : GitHub Actions
#   Organization or user: NINKCH
#   Repository          : dsh-artcraft
#   Workflow filename   : publish.yml
#   Environment name    : (leave empty)
#   Allowed actions     : ☑ Allow npm publish
#
# Release flow: bump "version" in package.json → commit → tag v* → push the tag.
# Requires npm >= 11.5.1 for OIDC trusted publishing (upgraded in-step below).

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC — this is what replaces the npm token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — only tags on main may publish
        run: |
          git fetch origin main --quiet
          # 容忍推送竞态：main 分支可能因网络抖动晚于标签几秒到达，重试 3 次
          for i in 1 2 3; do
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "tag commit is on main (attempt $i)"
              exit 0
            fi
            echo "attempt $i: tag commit not on main yet — retrying in 15s"
            sleep 15
            git fetch origin main --quiet
          done
          echo "::error::Tag is not on main. Releases are only cut from main after dev-branch testing and maintainer approval (see RELEASING.md)."
          exit 1

      - name: Guard — package.json version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::package.json version ($PKG) does not match tag (v$TAG). Bump the version before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
